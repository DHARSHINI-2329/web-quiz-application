<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TECH Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz">
    <h1>TECH Quiz</h1>
    <p id="progress">Question 1 / 50</p>

    <h2 id="question">Loading...</h2>

    <div class="options">
        <label><input type="radio" name="option" value="0"> <span></span></label>
        <label><input type="radio" name="option" value="1"> <span></span></label>
        <label><input type="radio" name="option" value="2"> <span></span></label>
        <label><input type="radio" name="option" value="3"> <span></span></label>
    </div>

    <button id="nextBtn">Next</button>
</div>

<script src="script.js"></script>
</body>
</html>
